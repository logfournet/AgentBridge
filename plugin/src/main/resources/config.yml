# AgentBridge Plugin Configuration
host: "127.0.0.1"
port: 7000
apiKey: "change-me-plugin-key"
agentId: "main"
sandboxRoot: "."        # relative to server working dir, or absolute path
exec:
  enabled: true
  timeoutMs: 30000
  whitelist:
    - "git"
    - "mvn"
    - "java"
    - "python"
    - "node"
    - "npm"
    - "dir"
    - "echo"
    - "type"
console:
  enabled: false          # allow Minecraft console commands (say/list/tps/...)
  timeoutMs: 10000
  whitelist: []           # empty = every command allowed (except blacklist)
  blacklist:
    - "stop"
    - "restart"
    - "reload"
    - "op"
    - "deop"
    # "plugman" intentionally NOT blocked: dùng để load/reload plugin từ AI
    # (console "plugman reload <Plugin>"). Bỏ dòng dưới nếu muốn chặn lại.
    # - "plugman"
    - "plugman"
chunkSize: 262144       # 256 KiB
debug: false
